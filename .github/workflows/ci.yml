name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vesper
          POSTGRES_PASSWORD: vesper
          POSTGRES_DB: vesper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vesper" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      LLM_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (Postgres 17, as deployed)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vesper:vesper@localhost:5432/vesper_test
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://vesper:vesper@localhost:5432/vesper_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
